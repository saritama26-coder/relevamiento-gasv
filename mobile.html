<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#17365d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Relevamiento GASV">
  <link rel="manifest" href="./manifest-mobile.webmanifest">
  <title>Relevamiento Arquitectónico — Móvil</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    #app-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    #status {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f8fafc;
      color: #334155;
      font-size: 14px;
      text-align: center;
      z-index: 10;
    }
    #status.hidden { display: none; }
    #status-card {
      width: min(92vw, 420px);
      padding: 24px;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 8px 32px rgba(15, 23, 42, .08);
    }
    #status-title {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 800;
      color: #17365d;
    }
    #status-text { margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="status">
    <div id="status-card">
      <h1 id="status-title">Relevamiento Arquitectónico</h1>
      <p id="status-text">Cargando versión móvil…</p>
    </div>
  </div>

  <!-- Mantiene la aplicación original intacta. -->
  <iframe id="app-frame" title="Relevamiento Arquitectónico" src="./index.html"></iframe>

  <script>
    (() => {
      const frame = document.getElementById("app-frame");
      const status = document.getElementById("status");

      const mobileCss = `
        :root {
          --mobile-gap: 10px;
          --mobile-pad: 12px;
        }

        html, body {
          max-width: 100% !important;
          overflow-x: hidden !important;
          background: #f8fafc !important;
          -webkit-text-size-adjust: 100% !important;
        }

        body {
          padding-bottom: env(safe-area-inset-bottom) !important;
        }

        #root {
          width: 100% !important;
          max-width: 100% !important;
          overflow-x: hidden !important;
        }

        button, input, select, textarea {
          font-size: 16px !important;
        }

        button {
          min-height: 44px !important;
          touch-action: manipulation !important;
        }

        input, select, textarea {
          min-height: 44px !important;
          border-radius: 10px !important;
        }

        textarea {
          min-height: 88px !important;
        }

        .grid {
          gap: var(--mobile-gap) !important;
        }

        [class~="md:grid-cols-2"],
        [class~="md:grid-cols-3"],
        [class~="md:grid-cols-4"],
        [class~="md:grid-cols-6"] {
          grid-template-columns: 1fr !important;
        }

        [class~="md:col-span-2"],
        [class~="md:col-span-3"],
        [class~="md:col-span-4"] {
          grid-column: auto !important;
        }

        [class~="md:flex-row"] {
          flex-direction: column !important;
        }

        [class~="md:w-64"] {
          width: 100% !important;
        }

        .overflow-x-auto {
          overflow-x: auto !important;
          -webkit-overflow-scrolling: touch !important;
          scrollbar-width: thin !important;
          max-width: 100% !important;
        }

        table {
          min-width: 760px !important;
          font-size: 13px !important;
        }

        th, td {
          white-space: nowrap !important;
        }

        th {
          position: sticky !important;
          top: 0 !important;
          z-index: 2 !important;
        }

        .print-card {
          padding: 12px !important;
          border-radius: 14px !important;
        }

        .print-card h2 {
          font-size: 18px !important;
          line-height: 1.25 !important;
        }

        .p-6 {
          padding: var(--mobile-pad) !important;
        }

        .p-5 {
          padding: 14px !important;
        }

        .p-4 {
          padding: 12px !important;
        }

        .gap-4 {
          gap: 10px !important;
        }

        .gap-3 {
          gap: 8px !important;
        }

        .space-y-6 > :not([hidden]) ~ :not([hidden]),
        .space-y-4 > :not([hidden]) ~ :not([hidden]),
        .space-y-3 > :not([hidden]) ~ :not([hidden]) {
          margin-top: 10px !important;
        }

        /* Barra superior y botones de gestión */
        .flex {
          max-width: 100% !important;
        }

        /* Modales */
        .fixed.inset-0 {
          padding: 8px !important;
          align-items: flex-start !important;
        }

        .fixed.inset-0 > div {
          max-height: calc(100dvh - 16px) !important;
          border-radius: 14px !important;
        }

        /* El manual usa navegación horizontal en móvil */
        [class~="md:flex-col"] {
          flex-direction: row !important;
          overflow-x: auto !important;
        }

        [class~="md:min-w-0"] {
          min-width: 200px !important;
        }

        /* Fotos: dos columnas cuando el ancho lo permite, una si no */
        img {
          max-width: 100% !important;
        }

        /* Menor densidad visual en listados */
        .text-2xl {
          font-size: 20px !important;
        }

        .text-xl {
          font-size: 18px !important;
        }

        /* Evita que textos largos ensanchen la pantalla */
        p, h1, h2, h3, h4, label, span, div {
          overflow-wrap: anywhere;
        }

        @media (min-width: 520px) and (max-width: 767px) {
          [class~="grid-cols-1"][class~="md:grid-cols-2"] {
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
          }
        }
      `;

      function injectMobileStyles() {
        try {
          const doc = frame.contentDocument;
          if (!doc || !doc.head) return;
          const old = doc.getElementById("gasv-mobile-overrides");
          if (old) old.remove();

          const style = doc.createElement("style");
          style.id = "gasv-mobile-overrides";
          style.textContent = mobileCss;
          doc.head.appendChild(style);

          // Mejora la experiencia táctil en controles nativos.
          doc.addEventListener("touchstart", () => {}, { passive: true });
          status.classList.add("hidden");
        } catch (error) {
          document.getElementById("status-text").textContent =
            "La aplicación se cargó, pero el navegador impidió aplicar los ajustes móviles automáticamente.";
        }
      }

      frame.addEventListener("load", () => {
        injectMobileStyles();
        // Reaplica por si React vuelve a reconstruir parte del DOM.
        setTimeout(injectMobileStyles, 400);
        setTimeout(injectMobileStyles, 1500);
      });

      window.addEventListener("resize", injectMobileStyles);
    })();
  </script>
</body>
</html>
